name: Bootstrap pinned CloudBrowser staging branch
# Runs once when this installation workflow is first committed to the staging branch.
# Changes source files ONLY on this non-default branch. No Railway deployment.
on:
  push:
    branches:
      - install/cloudbrowser-staging-20261020
    paths:
      - .github/workflows/bootstrap-cloudbrowser.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-cloudbrowser-staging
  cancel-in-progress: false
jobs:
  import-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/cloudbrowser-staging-20261020
          fetch-depth: 0
      - name: Pin and inspect source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XTREME-SYSTEMS/cloudbrowser-control.git /tmp/cloudbrowser-source
          git -C /tmp/cloudbrowser-source checkout --detach f45e86a651a877bbd9c340e3ebefd65a8167ae5b
          test "$(git -C /tmp/cloudbrowser-source rev-parse HEAD)" = f45e86a651a877bbd9c340e3ebefd65a8167ae5b
          rsync -a --exclude='.git/' --exclude='.github/' --include='/.env.example' --exclude='.env' --exclude='.env.*' --exclude='node_modules/' --exclude='dist/' /tmp/cloudbrowser-source/ ./
          test -f api/package.json
          test -f worker/package.json
          test -f browser-engine/package.json
          cp ci/release-gate.yml .github/workflows/release-gate.yml
          cat > SOURCE_IMPORT_RECEIPT.json <<'EOF'
          {
            "source_repo": "XTREME-SYSTEMS/cloudbrowser-control",
            "source_sha": "f45e86a651a877bbd9c340e3ebefd65a8167ae5b",
            "target_repo": "Strategic-Minds-AI/strategic-cloud-browser",
            "target_branch": "install/cloudbrowser-staging-20261020",
            "target_railway_environment": "NOT_DEPLOYED",
            "autonomous_workers_enabled": false,
            "notes": "Staging candidate. No production cutover, secrets migration, independent Guardian receipt, or E2E browser approval."
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate reproducible service lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for dir in api worker browser-engine; do
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix "$dir"
            test -s "$dir/package-lock.json"
            node -e "const p=require('./$dir/package-lock.json');if(p.lockfileVersion < 2)process.exit(1)"
          done
      - name: Enforce locked service Docker installs
        shell: bash
        run: |
          set -euo pipefail
          for dir in api worker browser-engine; do
            sed -i 's/^COPY package.json .\/$/COPY package*.json .\//' "$dir/Dockerfile"
            sed -i -E 's/^RUN npm install --omit=dev --no-audit --no-fund$/RUN npm ci --omit=dev --no-audit --no-fund/' "$dir/Dockerfile"
          done
          sed -i -E 's/^RUN npm install --production --omit=optional$/RUN npm ci --omit=dev --no-audit --no-fund/' browser-engine/Dockerfile
          sed -i '/^RUN npm install @xenova\/transformers@/d' browser-engine/Dockerfile
          grep -q 'RUN npm ci' api/Dockerfile
          grep -q 'RUN npm ci' worker/Dockerfile
          grep -q 'RUN npm ci' browser-engine/Dockerfile
      - name: Validate full source without releasing
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run lint
          npm run typecheck
          (cd browser-engine && npm test)
          node --check browser-engine/server.js
          node --check operator/index.js
      - name: Commit only validated files to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- .github/workflows/bootstrap-cloudbrowser.yml .github/workflows/release-gate.yml SOURCE_IMPORT_RECEIPT.json api/package-lock.json worker/package-lock.json browser-engine/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "bootstrap: import SHA-pinned CloudBrowser, lock services, activate release gate [bootstrap-built]"
            git push origin HEAD:install/cloudbrowser-staging-20261020
          fi
